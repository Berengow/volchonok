<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волчонок Тучка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,600&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Full-screen autumn meadow. A character picker sits over it; once a friend is called, the game HUD takes over.
   Single-world look on purpose: the sky follows the in-game time of day, not the light/dark theme. */
:root {
  --sky-top: #86a9e4;
  --sky-low: #e3d6e6;
  --glow: rgba(255, 244, 214, .95);
  --glow-x: 86%;
  --glow-y: 8%;
  --stars: 0;
  --moon: 0;
  --ink: #ffffff;
  --ink-shadow: rgba(24, 18, 32, .65);
  --frame: rgba(255, 255, 255, .95);
  --veil: rgba(28, 22, 36, .22);
  --veil-strong: rgba(36, 24, 30, .42);
  --accent: #ffd98a;
  --heart: #ff7896;
  --card-a: #b8c4c9;
  --f-title: "Lora", Georgia, "Times New Roman", serif;
  --f-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  overflow: hidden;
  overscroll-behavior: none;
  background-color: var(--sky-low);
  background-image:
    radial-gradient(circle at var(--glow-x) var(--glow-y), var(--glow) 0, transparent 32%),
    linear-gradient(var(--sky-top), var(--sky-low) 62%);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 1s ease;
}
.stars {
  position: fixed; inset: 0 0 40% 0; z-index: 0; pointer-events: none;
  opacity: var(--stars); transition: opacity 1s ease;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, #fff, transparent 70%),
    radial-gradient(1.2px 1.2px at 28% 32%, #fff, transparent 70%),
    radial-gradient(1.8px 1.8px at 44% 9%, #fff, transparent 70%),
    radial-gradient(1.2px 1.2px at 61% 26%, #fff, transparent 70%),
    radial-gradient(1.5px 1.5px at 74% 40%, #fff, transparent 70%),
    radial-gradient(1.2px 1.2px at 92% 22%, #fff, transparent 70%),
    radial-gradient(1.4px 1.4px at 6% 44%, #fff, transparent 70%),
    radial-gradient(1.2px 1.2px at 53% 46%, #fff, transparent 70%),
    radial-gradient(1.3px 1.3px at 35% 52%, #fff, transparent 70%);
}
.moon {
  position: fixed; z-index: 0; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 7%); right: 14%;
  width: 46px; height: 46px; border-radius: 50%;
  background: #f1f4ff; box-shadow: 0 0 40px 10px rgba(220, 230, 255, .45);
  opacity: var(--moon); transition: opacity 1s ease;
}
#scene {
  position: fixed; inset: 0; z-index: 1;
  width: 100%; height: 100%; display: block;
  touch-action: none;
}

/* game-style double white frame */
.frame {
  position: relative;
  color: var(--ink);
  background: var(--veil);
  border: 2px solid var(--frame);
  border-radius: 3px;
  outline: 1px solid var(--frame);
  outline-offset: 3px;
  text-shadow: 0 1px 2px var(--ink-shadow);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
button.frame, .slot { cursor: pointer; font: inherit; }
.frame:focus-visible, .slot:focus-visible .box, #pupName:focus-visible { outline-color: var(--accent); outline-width: 2px; }

.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.tod {
  justify-self: center;
  padding: 3px 18px 5px;
  font: italic 600 19px/1.2 var(--f-title);
  letter-spacing: .01em;
}
.tod::before, .tod::after {
  content: ""; position: absolute; top: 50%;
  width: 9px; height: 9px; margin-top: -6px;
  border: 2px solid var(--frame); border-radius: 50%;
  border-bottom-color: transparent;
}
.tod::before { left: -19px; transform: rotate(-45deg); }
.tod::after { right: -19px; transform: rotate(45deg); }
.sq { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; }
.sq svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px var(--ink-shadow)); }
.sq .off { display: none; }
.sq[aria-pressed="false"] .on { display: none; }
.sq[aria-pressed="false"] .off { display: inline; }

.side {
  position: fixed; z-index: 3; left: 0;
  top: calc(env(safe-area-inset-top, 0px) + 74px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; justify-items: start;
}
.namebox { display: block; padding: 3px 10px; }
#pupName {
  width: 7.5em; min-width: 0;
  font: 800 15px/1.3 var(--f-ui);
  color: var(--ink); text-shadow: 0 1px 2px var(--ink-shadow);
  background: transparent; border: 0; padding: 0; margin: 0;
  outline: none;
  -webkit-user-select: text; user-select: text;
}
.stat { display: flex; align-items: center; gap: 6px; padding: 3px 10px; font-size: 13px; font-weight: 800; }
.stat svg { width: 16px; height: 16px; color: var(--heart); filter: drop-shadow(0 1px 1px var(--ink-shadow)); }
#moodNum { font-variant-numeric: tabular-nums; min-width: 2ch; }
#moodText { font-weight: 700; opacity: .92; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 10px;
  pointer-events: none;
}
.hint {
  margin: 0; max-width: 34ch; text-align: center;
  font-size: 14px; font-weight: 800; line-height: 1.35;
  text-shadow: 0 1px 3px var(--ink-shadow), 0 0 10px var(--ink-shadow);
  transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }
.hotbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; pointer-events: auto; }
.ripple {
  position: fixed; z-index: 2; pointer-events: none;
  width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 0 12px rgba(255, 190, 210, .8);
  animation: rip .55s ease-out forwards;
}
.ripple.heart { border-color: rgba(255, 150, 185, .95); }
@keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.slot {
  display: grid; justify-items: center; gap: 7px;
  background: none; border: 0; padding: 0; color: var(--ink);
}
.slot .box { width: 54px; height: 54px; display: grid; place-items: center; transition: transform .12s ease; }
.slot svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 1px var(--ink-shadow)); }
.slot .lbl { font-size: 11px; font-weight: 800; letter-spacing: .02em; text-shadow: 0 1px 2px var(--ink-shadow); }
.slot.main .box { border-color: var(--accent); outline-color: var(--accent); box-shadow: 0 0 14px rgba(255, 217, 138, .55); }
.slot:active .box, .frame:active { transform: scale(.93); }
.food-ico { display: none; }
.food-ico.on { display: inline; }

/* ---------- friend picker ---------- */
.pick {
  position: fixed; inset: 0; z-index: 5;
  overflow-y: auto; overscroll-behavior: contain;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(30, 20, 34, .18), rgba(40, 22, 20, .42));
  transition: opacity .45s ease, visibility .45s;
}
body.playing .pick { opacity: 0; visibility: hidden; pointer-events: none; }
body:not(.playing) .top, body:not(.playing) .side, body:not(.playing) .dock { opacity: 0; visibility: hidden; }
.top, .side, .dock { transition: opacity .45s ease, visibility .45s; }
.pick-in {
  min-height: 100%;
  max-width: 980px; margin: 0 auto;
  display: grid; align-content: center; justify-items: center; gap: 14px;
}
.pick-title { margin: 6px 0 0; font-size: 22px; }
.pick-sub {
  margin: 0; max-width: 36ch; text-align: center; text-wrap: balance;
  font-size: 14px; font-weight: 800; line-height: 1.4;
  text-shadow: 0 1px 3px var(--ink-shadow), 0 0 10px var(--ink-shadow);
}
.cards {
  width: 100%;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px;
  padding: 8px 4px;
}
@media (min-width: 760px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 280px)); justify-content: center; gap: 22px; }
  .card .pic { aspect-ratio: 4 / 5; }
}
.card {
  display: grid; grid-template-rows: auto auto auto 1fr; justify-items: center; text-align: center;
  padding: 0 0 10px; overflow: visible; min-width: 0;
  background: var(--veil-strong);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.card .pic {
  width: 100%; aspect-ratio: 1 / 1; max-width: 100%;
  display: block; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, color-mix(in srgb, var(--card-a) 70%, white) 0, transparent 70%),
    linear-gradient(170deg, color-mix(in srgb, var(--card-a) 55%, #2a1c20) 0, color-mix(in srgb, var(--card-a) 25%, #1d1418) 100%);
}
.card .pic::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 30%;
  background: linear-gradient(transparent, rgba(20, 12, 16, .45));
}
.card img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0;
  transition: transform .35s ease;
  -webkit-user-drag: none;
}
.card .nm { margin-top: 8px; font: italic 600 19px/1.15 var(--f-title); }
.card .kind { font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.card .tagl { padding: 4px 8px 0; font-size: 12.5px; font-weight: 700; line-height: 1.3; opacity: .95; text-wrap: balance; }
.card .mb { margin-top: 6px; font-size: 11px; font-weight: 800; opacity: .75; align-self: end; }
.card .last {
  position: absolute; top: 8px; left: 8px; z-index: 1;
  padding: 2px 7px; border-radius: 99px;
  font-size: 11px; font-weight: 900; color: #3b1d22; background: var(--accent); text-shadow: none;
}
.card[aria-checked="true"] {
  border-color: var(--accent); outline-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 26px rgba(255, 217, 138, .55);
  transform: translateY(-4px);
}
.card[aria-checked="true"] img { transform: scale(1.06); }
.go {
  position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); z-index: 2;
  min-width: min(320px, 100%); padding: 10px 22px 12px;
  box-shadow: 0 6px 24px rgba(20, 10, 16, .45);
  font: 900 17px/1.2 var(--f-ui); letter-spacing: .02em;
  background: linear-gradient(90deg, rgba(255, 217, 138, .55) var(--p, 0%), var(--veil-strong) var(--p, 0%));
  border-color: var(--accent); outline-color: var(--accent);
}
.go:disabled { cursor: default; opacity: .75; }
.go small { display: block; font-size: 11.5px; font-weight: 800; opacity: .9; }
.note { margin: 0; font-size: 11.5px; font-weight: 700; opacity: .8; text-align: center; max-width: 46ch; text-shadow: 0 1px 2px var(--ink-shadow); }
.boot {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
  font: 800 15px/1.4 var(--f-ui); text-align: center; padding: 0 24px;
  text-shadow: 0 1px 3px var(--ink-shadow);
  pointer-events: none;
}
body.shot .top, body.shot .side, body.shot .dock, body.shot .pick, body.shot .stars, body.shot .moon { display: none !important; }
body.shot { background: transparent; }
@media (prefers-reduced-motion: reduce) {
  .ripple { animation-duration: .01s; }
  body, .stars, .moon, .hint, .slot .box, .card, .card img, .pick, .top, .side, .dock { transition: none; }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>

<div class="stars" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<canvas id="scene" aria-label="Твой друг на поляне. Гладь по голове, тапай по лицу, ушкам, хвосту или телу."></canvas>
<div class="boot" id="boot">Загружаю поляну…</div>

<header class="top">

</header>

<aside class="side">

      <span class="frame box">

        <svg class="food-ico" data-food="apple" viewBox="0 0 32 32"><path d="M16 10c-2-2.4-8.5-2.6-9.6 3.6-1 5.6 2.8 13 6.6 13 1.4 0 2-.7 3-.7s1.6.7 3 .7c3.8 0 7.6-7.4 6.6-13C24.5 7.4 18 7.6 16 10z" fill="#e0453e"/><path d="M16 10.5c0-2.6.8-4.6 2.4-6" stroke="#6b3d22" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M18 7c1.8-2.6 5-2.8 6.6-1.8-1.2 2.4-4 3.2-6.6 1.8z" fill="#7cc04c"/><ellipse cx="11.5" cy="14" rx="1.8" ry="3" fill="#ff8f7d" opacity=".8"/></svg>

      </span>
      <span class="lbl" id="foodLabel">Ножка</span>
    </button>
    <button class="slot" id="btnHug" type="button">
      <span class="frame box"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27s-9-5.4-11.4-11C3 12 5.4 7.6 9.6 7.6c2.6 0 4.3 1.4 6.4 3.8 2.1-2.4 3.8-3.8 6.4-3.8 4.2 0 6.6 4.4 5 8.4C25 21.6 16 27 16 27z" fill="#ff8fb3" stroke="#fff"/></svg></span>

    <button class="slot" id="btnPlay" type="button">
      <span class="frame box"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="16" cy="16" r="10"/><path d="M7 12.5c5.8 2 12.2 2 18 0M7 19.5c5.8-2 12.2-2 18 0"/></svg></span>

</footer>

<section class="pick" id="pick" aria-labelledby="pickTitle">

let gltfLoader = null;
// Models ship as glTF JSON with the geometry as base64. The page may not fetch data: URLs,
// so decode the buffer here and hand the loader an in-memory .glb instead.
async function fetchModel(url, prog) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
  const total = +res.headers.get('content-length') || 0;
  const chunks = []; let got = 0;
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      chunks.push(value); got += value.length;
      prog(total ? Math.min(.97, got / total) : null);
    }
  } else chunks.push(new Uint8Array(await res.arrayBuffer()));
  const all = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const j = JSON.parse(new TextDecoder().decode(all));
  const uri = j.buffers[0].uri || '';
  const s = atob(uri.slice(uri.indexOf(',') + 1));
  const bin = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i);
  delete j.buffers[0].uri;
  const js = new TextEncoder().encode(JSON.stringify(j));
  const jsLen = (js.length + 3) & ~3, binLen = (bin.length + 3) & ~3;
  const glb = new Uint8Array(12 + 8 + jsLen + 8 + binLen);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jsLen, true); dv.setUint32(16, 0x4E4F534A, true);
  glb.fill(0x20, 20, 20 + jsLen); glb.set(js, 20);
  dv.setUint32(20 + jsLen, binLen, true); dv.setUint32(24 + jsLen, 0x004E4942, true);
  glb.set(bin, 28 + jsLen);
  return glb.buffer;
}
async function loadFile(def, prog) {
  if (def.type === 'fbx') {
    return new Promise((res, rej) => new FBXLoader().load(def.file, o => res({ scene: o, animations: o.animations, userData: {} }),
      e => prog(e.total ? e.loaded / e.total : null), rej));
  }
  if (!gltfLoader) { gltfLoader = new GLTFLoader(); gltfLoader.register(p => new VRMLoaderPlugin(p)); }
  const buf = await fetchModel(def.file, prog);
  const base = def.file.slice(0, def.file.lastIndexOf('/') + 1);
  return new Promise((res, rej) => gltfLoader.parse(buf, base, res, rej));
}

// FBX hands the model back before its texture images arrive; wait so the friend never shows up black
async function texturesReady(root, prog) {
  const maps = new Set();
  root.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { if (m.map) maps.add(m.map); }); });
  const t0 = now();
  while (now() - t0 < 20) {
    if ([...maps].every(t => t.image && (t.image.naturalWidth || t.image.width))) return;
    prog(null);
    await new Promise(r => setTimeout(r, 120));
  }
}

// glTF/FBX materials -> cel shading that matches the meadow; black untextured parts stay as ink (outline hulls, brows)
function toonify(root) {
  const conv = m => {
    if (!m.map && m.color && m.color.getHex() === 0) return new THREE.MeshBasicMaterial({ color: 0x2b1d1a, side: m.side });
    const alpha = /alpha/i.test(m.name) ? .5 : m.alphaTest;
    const t = new THREE.MeshToonMaterial({
      map: m.map || null, color: m.map ? 0xffffff : m.color, gradientMap: grad,
      side: m.side, transparent: m.transparent, opacity: m.opacity, alphaTest: alpha || 0, depthWrite: m.depthWrite

// inverted-hull outlines, one per mesh, sharing geometry, skin and morphs with the original
function addOutlines(root, width) {
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  const list = []; root.traverse(o => { if (o.isMesh) list.push(o); });
  for (const m of list) {
    const w = width / (m.getWorldScale(_v).x || 1); // width is in world units, the hull grows in geometry units
    const ink = new THREE.MeshBasicMaterial({ color: 0x2b1d1f, side: THREE.BackSide });
    ink.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n transformed += normalize(normal) * ${w.toFixed(6)};`);
    };
    ink.customProgramCacheKey = () => 'ink' + w.toFixed(6);
    const mats = [].concat(m.material).map(x => (x.transparent || x.alphaTest > 0) ? hidden : ink);
    const mat = Array.isArray(m.material) ? mats : mats[0];
    const o = m.isSkinnedMesh ? new THREE.SkinnedMesh(m.geometry, mat) : new THREE.Mesh(m.geometry, mat);
    if (m.isSkinnedMesh) o.bind(m.skeleton, m.bindMatrix);
    if (m.morphTargetInfluences) { o.morphTargetInfluences = m.morphTargetInfluences; o.morphTargetDictionary = m.morphTargetDictionary; }

    o.frustumCulled = false; o.raycast = () => {}; o.userData.outline = true;
    m.parent.add(o);
  }
}

  rotChar(av, B.chest, C.lean * .5 + breath * .02, C.twist * .5 + C.headY * .08, C.roll * .4);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const PET = ['head', 'ear', 'face', 'cheek', 'chin', 'tail', 'back'];
function hit(x, y) {
  if (!av) return null;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(av.proxies, false);
  if (!hits.length) return null;
  let h = hits[0];
  const pref = hits.find(x => x.object.userData.part === 'hand' && x.distance - h.distance < av.headR * .6);
  if (pref) h = pref;
  const ud = h.object.userData;
  const p = h.object.worldToLocal(h.point.clone());
  const fake = (part, side) => Object.assign({}, h, { object: { userData: { part, side } } });
  if (ud.part === 'head' && p.z > .2) {
    if (p.y < -.42) return fake('chin');
    if (p.z > .3 && Math.abs(p.x) > .36 && p.y < .15) return fake('cheek', p.x > 0 ? 0 : 1);
    if (p.z > .45 && p.y < .3) return fake('face');

}
function setLook(x, y) {
  S.lookT.set(clamp(x / innerWidth * 2 - 1, -1, 1), clamp(-(y / innerHeight - .35) * 2, -1, 1));
  S.lastPointer = now();
}
let G = null, lastEmptyTap = 0;
canvas.addEventListener('pointerdown', e => {
  touched(); setLook(e.clientX, e.clientY);
  const h = hit(e.clientX, e.clientY);
  G = { id: e.pointerId, t: now(), moved: 0, h, lx: e.clientX, ly: e.clientY, x0: e.clientX, y0: e.clientY, mode: null, lt: now() };
  if (h && !S.sleeping) {
    const part = h.object.userData.part;
    if (part === 'hand') G.timer = setTimeout(() => { if (G && !G.mode) { G.mode = 'hold'; holdHand(h.object.userData.side); } }, 420);
    if (part === 'head') G.timer = setTimeout(() => { if (G && !G.mode) { G.mode = 'rest'; S.restHand = 1; giggle(1, .5); buzz(10); } }, 520);
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  setLook(e.clientX, e.clientY);
  if (!G || e.pointerId !== G.id) return;
  const dx = e.clientX - G.lx, dy = e.clientY - G.ly; G.lx = e.clientX; G.ly = e.clientY;
  const d = Math.hypot(dx, dy); G.moved += d;
  const t = now(), dtp = Math.max(.008, t - G.lt); G.lt = t;
  if (!G.mode && G.moved > 10) {
    clearTimeout(G.timer);
    G.mode = G.h && PET.includes(G.h.object.userData.part) ? 'pet' : 'rotate';
  }
  if (G.mode === 'rotate' && av) {
    const r = dx * .011;
    S.rot += r; S.rotV = r / dtp; S.lastRotate = t; S.lastInput = t;
    if (S.action && S.action.type === 'turnback') S.action = null;
  } else if (G.mode === 'pet') {
    let h = hit(e.clientX, e.clientY); if (!h || !PET.includes(h.object.userData.part)) return;
    // the face zones stay put for the whole stroke, even while the head tilts under the finger
    const FACE = ['head', 'face', 'cheek', 'chin'], z0 = G.h.object.userData;
    if (FACE.includes(z0.part) && FACE.includes(h.object.userData.part) && z0.part !== 'face') h = Object.assign({}, h, { object: { userData: z0 } });

}
canvas.addEventListener('pointerup', endPointer);

// arm presets: [raise, forward, elbow, up, back]
function arms(T, side, [r, f, e, up = 0, back = 0]) {

}

      if (p < .62) {
        T.headX = -.08; F.eyes = 'wide'; F.mouth = 'o'; both(T, [.5, .9, 1, .8]); F.sparkle = 1;
        T.crouch = .15 + .1 * Math.abs(Math.sin(t * 6)); T.tailAmp = .8; T.tailSpd = 14;
      } else {
        const q = (p - .62) / .38, k = (q * 3) % 1;
        T.jump = .32 * hump(k, .15, .85); T.crouch = .5 * (k < .15 || k > .85 ? 1 : 0);
        both(T, YAY); T.headZ += .2 * Math.sin(Math.PI * q * 6);
        F.eyes = 'happy'; F.mouth = 'open'; F.blush = .7; T.tailAmp = 1.2; T.tailSpd = 22;
      }
      break;
    }
    case 'howl': {
      const env = p < .15 ? ease(p / .15) : p > .88 ? 1 - (p - .88) / .12 : 1;
      T.headX = mix(T.headX, -.75, env); T.headY *= 1 - env; T.lean = -.1 * env;
      F.eyes = env > .3 ? 'happy' : F.eyes; F.mouth = env > .3 ? 'howl' : F.mouth;
      T.earL = T.earR = -.45 * env; both(T, [.55 * env + .2, 1.0, 1.05 * env, .8]); T.tailAmp = .15; break;
    }
    case 'yawn':
      T.headX = mix(T.headX, -.35, s); F.eyes = 'half'; F.mouth = s > .3 ? 'howl' : 'dot';
      both(T, [.2 + 2.5 * s, .2, .3 * s, 1]); T.earL = T.earR = -.3 * s; break;
  }
}
function actionEnded(a) {
  if (a.type === 'eat') {
    if (S.held) { S.held.visible = false; S.held = null; }
    giggle(1.15); say('♥'); snd.fx.chime();
    burst(heartTex, anchor(0, 1.0, .4), 5);
  }
  if (a.type === 'hug') { burst(heartTex, anchor(0, .8, .6), 7, .18); say('♥♥'); }
  if (a.type === 'turnback') S.rot = 0;
  if (a.type === 'dance') { burst(starTex, anchor(0, 1, .5), 6, .13); snd.fx.twinkle(); }
}

/* ================= picker ================= */
const cardsEl = $('#cards'), goBtn = $('#goBtn');
let picked = store.get('wk.char', null);
if (!byId(picked)) picked = null;
let loadingId = null;
function renderCards() {
  cardsEl.innerHTML = '';
  for (const c of CHARS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card frame'; b.setAttribute('role', 'radio'); b.dataset.id = c.id;
    b.style.setProperty('--card-a', c.tint);
    b.setAttribute('aria-checked', String(picked === c.id));
    b.innerHTML = `<span class="pic"><img src="assets/p/${c.id}.webp" alt="" loading="lazy" onerror="this.remove()"></span>
      <span class="nm"></span><span class="kind"></span><span class="tagl"></span><span class="mb"></span>`;
    b.querySelector('.nm').textContent = c.name;
    b.querySelector('.kind').textContent = c.kind;
    b.querySelector('.tagl').textContent = c.tag;
    b.querySelector('.mb').textContent = (av && av.def.id === c.id) ? 'гуляет с тобой' : `${String(c.mb).replace('.', ',')} МБ`;
    if (store.get('wk.char', null) === c.id) {
      const l = document.createElement('span'); l.className = 'last'; l.textContent = '♥ твой друг'; b.appendChild(l);
    }
    b.addEventListener('click', () => { if (loadingId) return; picked = c.id; snd.init(); renderCards(); syncGo(); });
    cardsEl.appendChild(b);
  }
}
function syncGo(pct) {
  const c = byId(picked);
  goBtn.style.setProperty('--p', (pct || 0) + '%');
  if (loadingId) {
    goBtn.disabled = true;
    goBtn.innerHTML = `Зову ${byId(loadingId).name}…<small>${pct != null ? Math.round(pct) + '%' : 'загружаю модель'}</small>`;
    return;
  }
  goBtn.disabled = !c;
  goBtn.textContent = !c ? 'Выбери, кого позвать' : (av && av.def.id === c.id) ? `Вернуться к ${c.name}` : `Позвать: ${c.name}`;
}
function showPick() { document.body.classList.remove('playing'); renderCards(); syncGo(); }
function hidePick() { document.body.classList.add('playing'); }
$('#friendsBtn').addEventListener('click', () => { touched(); showPick(); });
goBtn.addEventListener('click', () => {
  snd.init();
  if (!picked) return;
  if (av && av.def.id === picked) { hidePick(); return; }
  callFriend(picked);
});

async function callFriend(id) {
  const def = byId(id);
  loadingId = id; syncGo(0);
  try {
    const a = await buildAvatar(def, f => syncGo(f != null ? f * 100 : null));
    snd.breathOff();
    disposeAvatar(av);
    av = a; scene.add(av.holder);
    store.set('wk.char', id);
    snd.setPitch(def.pitch);
    S.happy = clamp(store.get('wk.happy.' + id, 60), 0, 100);
    S.sleeping = false; S.action = null; S.treat = null; S.held = null; S.holding = null; S.pet = 0; S.rot = 0; S.rotV = 0;
    C = C0(); CV = {};
    Object.values(foods).forEach(f => { f.visible = false; });
    nameInput.value = store.get('wk.name.' + id, def.name);
    document.querySelectorAll('.food-ico').forEach(s => s.classList.toggle('on', s.dataset.food === def.food));
    $('#foodLabel').textContent = FOOD_NAME[def.food];
    hintIdx = 0; $('#hint').textContent = HINTS[0]; $('#hint').classList.remove('gone');
    hud();
    loadingId = null;
    hidePick();
    act('arrive', 1.4); say('♥'); snd.play('greet', { delay: .25 });
    setTimeout(() => { if (av === a && !S.action) act('wave', 1.8, { side: 1 }); }, 1500);
    S.lastInput = now();
  } catch (err) {
    console.error(err);
    loadingId = null; syncGo();
    goBtn.innerHTML = `Не получилось позвать ${def.name}<small></small>`;
    goBtn.querySelector('small').textContent = 'нажми, чтобы попробовать ещё раз · ' + String(err && (err.message || err)).slice(0, 90);
    goBtn.disabled = false;
  }
}

/* ================= loop ================= */
let last = now();
function frame() {
  const t = now(), dt = Math.min(.05, t - last); last = t;

  blades.forEach(b => { b.rotation.z = Math.sin(t * 1.5 + b.position.x * .5 + b.userData.ph) * .12; });
  const night = TOD[todKey].night;
  const mp = moteGeo.attributes.position;
  for (let i = 0; i < MOTES; i++) {
    let y = mp.getY(i) + dt * (night ? .04 : .09);
    if (y > 3.7) y = .2;
    mp.setY(i, y); mp.setX(i, mp.getX(i) + Math.sin(t * .4 + i) * dt * .12);
  }
  mp.needsUpdate = true;
  moteMat.opacity = night ? .55 + .45 * Math.sin(t * 2.2) : .75;
  flies.forEach(f => {
    const ph = f.userData.ph;
    f.position.set(Math.sin(t * .3 + ph) * 1.8, .8 + Math.sin(t * .7 + ph) * .35, .5 + Math.cos(t * .23 + ph) * 1.1);
    f.rotation.set(-1.1, t * .3 + ph, 0);
    const flap = Math.sin(t * 18 + ph) * 1.1; f.userData.l.rotation.y = flap; f.userData.r.rotation.y = -flap;
  });

  if (av) live(t, dt);

  if (emote && av) {
    const e = (t - emote.t0) / 1.5;
    if (e >= 1) { scene.remove(emote.s); emote.s.material.dispose(); emote = null; }
    else {
      const sc = e < .15 ? backOut(e / .15) : 1;
      emote.s.position.copy(anchor(1.5, 1.4 + e * .4, .3));
      emote.s.scale.set(.42 * sc, .21 * sc, 1);
      emote.s.material.opacity = e > .7 ? 1 - (e - .7) / .3 : 1;
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life += dt;
    const f = q.life / q.max;
    if (f >= 1) { scene.remove(q.s); q.s.material.dispose(); parts.splice(i, 1); continue; }
    q.s.position.addScaledVector(q.v, dt);
    q.v.multiplyScalar(Math.exp(-dt * 1.2));
    q.s.position.x += Math.sin(q.life * 4 + q.ph) * .12 * dt;
    q.s.material.opacity = 1 - f * f;
    const sc = q.size * (f < .15 ? backOut(f / .15) : 1);
    q.s.scale.set(sc * 2, sc, 1);
  }

  renderer.render(scene, camera);
  if (!SHOT) requestAnimationFrame(frame);
}

function live(t, dt) {
  S.happy = Math.max(0, S.happy - dt * .1);
  if (t - S.lastSave > 2) { S.lastSave = t; store.set('wk.happy.' + av.def.id, Math.round(S.happy)); hud(); }
  const petting = t - S.petHold < .25;
  if (!petting) { S.pet = Math.max(0, S.pet - dt * .6); S.petTime = 0; } else S.petTime += dt;
  S.strokeTilt *= Math.exp(-dt * 2);
  S.tw[0] *= Math.exp(-dt * 6); S.tw[1] *= Math.exp(-dt * 6);
  S.blushBoost = Math.max(0, S.blushBoost - dt * .25);
  const playing = document.body.classList.contains('playing');

  // turning: inertia, then she turns back to you on her own
  if (!G || G.mode !== 'rotate') { S.rot += S.rotV * dt; S.rotV *= Math.exp(-dt * 4); }
  if (!S.action && !S.holding && !S.sleeping && Math.abs(wrap(S.rot)) > .35 && t - S.lastRotate > 4.5 && (!G || G.mode !== 'rotate')) turnBack();

  // long petting melts her heart
  if (S.petTime > 4 && t - S.melted > 8 && !S.sleeping) {
    S.melted = t; burst(heartTex, anchor(0, 1.1, .6), 8, .17); snd.fx.chime(); giggle(1.15, .7, .1); say('♥♥'); addHappy(6); S.blushBoost = 1;
  }

  // idle life
  if (!S.action && !S.sleeping && !S.holding && t > S.nextIdle && !SHOT && !petting) {
    S.nextIdle = t + 2.5 + Math.random() * 4;
    if (t - S.lastPointer > 2.5) S.lookT.set((Math.random() * 2 - 1) * .6, (Math.random() * 2 - 1) * .35);
    const r = Math.random(), h = S.happy;
    if (h > 75 && r < .1) { act('uppies', 1.9); giggle(1.15, .7); say('♥'); }
    else if (h > 65 && r < .18) { act('wink', 1.3, { side: Math.random() < .5 ? 0 : 1 }); snd.fx.twinkle(); say('☆'); }
    else if (h > 55 && r < .28) act('sway', 2.2);
    else if (r < .42) { act('tilt', 1.1, { dir: Math.random() < .5 ? -1 : 1 }); if (Math.random() < .4) say('?'); }
    else if (t - S.lastInput > 9 && r < .55) { act('peek', 1.8, { dir: Math.random() < .5 ? -1 : 1 }); say('?'); }
    else if (r < .7) S.tw[Math.random() < .5 ? 0 : 1] = .8;
  }
  if (t > S.nextPose) { S.nextPose = t + 8 + Math.random() * 8; S.idlePose = pick(['down', 'down', 'behind', 'clasp']); }
  if (t - S.lastPointer > 4 && t - S.lastPointer < 4.1) S.lookT.set(0, 0);
  if (!S.sleeping && !S.action && !S.holding && t - S.lastInput > 60 && !SHOT && playing) sleep();
  // blinks: quick close, short hold, softer open; sometimes twice
  if (t > S.nextBlink) {
    S.blinkT0 = t; S.blinkDouble = Math.random() < .2;
    S.nextBlink = t + (S.pet > .2 ? 1.2 : 2.2) + Math.random() * 3.5 + (S.blinkDouble ? .35 : 0);
  }
  const bt = t - S.blinkT0, blinkOne = x => x < .06 ? x / .06 : x < .1 ? 1 : x < .22 ? 1 - (x - .1) / .12 : 0;
  const blink = Math.max(blinkOne(bt), S.blinkDouble ? blinkOne(bt - .26) : 0);
  S.look.lerp(S.lookT, 1 - Math.exp(-dt * 5));

  const h = S.happy / 100;
  const facing = clamp(-wrap(S.rot), -1.15, 1.15); // keep looking at you over the shoulder
  const T = {
    sit: 0, crouch: 0, lean: 0, roll: 0, twist: clamp(-wrap(S.rot), -.5, .5) * .6, near: 0,
    headX: -S.look.y * .22, headY: facing * .8 + S.look.x * .4, headZ: Math.sin(t * .7) * .04,
    earL: S.tw[0] + .15 * (h - .5), earR: S.tw[1] + .15 * (h - .5),
    armL: .2, armR: .2, fwdL: .15, fwdR: .15, elbowL: .15, elbowR: .15, upL: 0, upR: 0, backL: 0, backR: 0, waveL: 0, waveR: 0,
    tailAmp: .25 + .4 * h, tailSpd: 5 + 6 * h, jump: 0, scale: 1
  };
  if (S.idlePose === 'behind') both(T, [.3, -.95, .6, 0, 1]);
  else if (S.idlePose === 'clasp') both(T, [.28, 1.0, .75]);
  const F = { eyes: 'round', mouth: S.happy > 55 ? 'smile' : S.happy < 25 ? 'pout' : 'dot', blush: .12 + .25 * h + S.blushBoost * .8, blink, sparkle: 0 };
  if (S.happy < 25 && !S.action) { F.eyes = 'jito'; T.earL -= .3; T.earR -= .3; T.headX += .1; }
  if (S.pet > .08) {
    const k = S.pet;
    F.mouth = 'cat'; F.blush = Math.max(F.blush, .6 + .4 * k); T.tailAmp = .9; T.tailSpd = 16;
    switch (S.petZone) {
      case 'cheek': {
        const sd = S.petSide === 0 ? -1 : 1;
        F.eyes = 'happy'; T.headZ += sd * .32 * k; T.headX += .06 * k; arms(T, S.petSide, [.45, 1.0, 1.05, .7]); break;
      }
      case 'chin': F.eyes = k > .5 ? 'sleep' : 'happy'; T.headX -= .4 * k; T.earL = T.earR = -.5 * k; both(T, [.25, -.6, .5, 0, 1]); break;
      case 'tail': F.eyes = 'half'; T.twist = -.4 * k; T.headY = -.7 * k; T.tailAmp = 1.3; T.tailSpd = 24; break;
      case 'back': F.eyes = 'half'; T.headY = clamp(-wrap(S.rot), -1.1, 1.1); break;
      case 'ear': F.eyes = 'happy'; T['ear' + (S.petSide ? 'R' : 'L')] = -.9 * k; T.headZ += (S.petSide ? .25 : -.25) * k; break;
      default:
        F.eyes = S.petTime > 2.5 ? 'half' : 'happy';
        T.earL -= .7 * k; T.earR -= .7 * k; T.headZ += S.strokeTilt * k; T.headX += .14 * k; T.crouch = .15 * k;
    }
  }
  if (S.restHand > 0) { F.eyes = 'sleep'; F.mouth = 'cat'; F.blush = 1; T.headX -= .12; T.earL = T.earR = -.8; T.tailAmp = .9; if (Math.random() < .03) spawn(heartTex, anchor((Math.random() - .5) * 2, 1.3, .3), { size: .13 }); }
  if (S.holding) {
    const sd = S.holding.side, k = Math.min(1, (t - S.holding.t0) * 3);
    arms(T, sd, [.95, 1.35, .12]); T.headX += .18 * k; T.headY += (sd ? .25 : -.25) * k; T.roll = .05 * Math.sin(t * 2.5);
    F.eyes = 'happy'; F.mouth = 'fluster'; F.blush = 1; T.tailAmp = 1; T.tailSpd = 14;
    if (Math.random() < .025) spawn(heartTex, anchor(sd ? -1.2 : 1.2, .3, 1), { size: .13 });
  }
  if (S.sleeping) {
    Object.assign(T, { sit: 1, lean: -.05, headX: .35, headY: .1, headZ: .2 + Math.sin(t * .8) * .04, earL: -.45, earR: -.45, tailSpd: 2 });
    both(T, [.25, .7, .45]);
    T.tailAmp = S.pet > .1 ? .35 : .05;
    F.eyes = 'sleep'; F.mouth = S.pet > .08 ? 'cat' : 'smile'; F.blush = .35 + S.pet * .4; F.blink = 0;
    if (t > S.nextZ) { S.nextZ = t + 1.6; spawn(zTex, anchor(.9, .8, .3), { size: .2, life: 2.2, vy: .3, spread: .2 }); }
  }
  if (S.action) {
    const a = S.action, p = (t - a.t0) / a.dur;
    if (p >= 1) { S.action = null; actionEnded(a); }
    else {
      pose(a, p, T, F, t);
      if (a.type === 'turnback') S.rot = a.from * (1 - ease(p));
      if (a.type === 'howl' && p > .15 && p < .85 && t > S.nextNote) {
        S.nextNote = t + .4; spawn(noteTex, anchor(.3, .4, 1.2), { size: .18, life: 1.6, vy: .6 });
      }
      if (a.type === 'play') {
        const el = t - a.t0;
        const marks = [[.15, '3'], [1.15, '2'], [2.15, '1']];
        while (S.nextCount < marks.length && el > marks[S.nextCount][0]) { say(marks[S.nextCount][1]); snd.fx.blip(); S.nextCount++; }
        const hops = [3.45, 4.1, 4.75];
        while (S.nextCount >= 3 && S.nextCount < 6 && el > hops[S.nextCount - 3]) {
          snd.fx.boing(); if (S.nextCount === 3) { giggle(1.3); say('!'); } else if (S.nextCount === 5) giggle(1.4, .7);
          S.nextCount++;
        }
      }
    }
  }

  // she talks with her mouth when her voice plays
  const lv = snd.level();
  S.talk += (clamp((lv - .01) * 9, 0, 1) - S.talk) * (1 - Math.exp(-dt * 25));
  if (S.talk > .05 && !S.sleeping) { F.talk = S.talk; if (F.mouth === 'smile' || F.mouth === 'dot') F.mouth = 'dot'; }

  // treat flight into the hands
  if (S.treat) {
    const b = S.treat, p = (t - b.t0) / b.dur;
    const to = anchor(.3, -1.15, 1.4);
    if (p < 1) {
      b.food.position.copy(b.from).lerp(to, ease(p)); b.food.position.y += Math.sin(Math.PI * p) * .5;
      b.food.rotation.set(t * 6, 0, t * 9); b.food.scale.setScalar(mix(1, .7, p));
    } else {
      S.treat = null; S.held = b.food;
      act('eat', 2.2); snd.fx.munch(.2); snd.fx.munch(.7); snd.fx.munch(1.2); snd.fx.munch(1.7); giggle(1.2, .7, .05);
      buzz(15); addHappy(12); say(':3');
    }
  }
  if (S.held) {
    S.held.position.copy(anchor(.28, -1.15, 1.3));
    S.held.rotation.set(.3, 0, .5);
    if (S.action && S.action.type === 'eat') S.held.scale.setScalar(.7 * (1 - .6 * (t - S.action.t0) / S.action.dur));
  }

  // springs give every motion a soft, bouncy follow-through
  for (const key in C) {
    const tgt = T[key] ?? 0;
    if (key === 'tailSpd') { C[key] += (tgt - C[key]) * (1 - Math.exp(-dt * 4)); continue; }
    const [k, d] = SPRING[key] || [110, 15];
    const v = (CV[key] || 0) + ((tgt - C[key]) * k - (CV[key] || 0) * d) * dt;
    CV[key] = v; C[key] += v * dt;
  }

  const breath = Math.sin(t * (S.sleeping ? 1.6 : 2.4));
  S.wagPh += dt * C.tailSpd;
  poseAvatar(av, C, t, breath, S.wagPh);
  faceAvatar(av, F, dt);
  av.holder.position.set(0, T.jump, C.near);
  av.holder.rotation.y = S.rot;
  av.holder.scale.setScalar(T.scale);
  if (av.vrm) av.vrm.update(dt);
  const sh = 1 - .5 * Math.min(1, T.jump / .4);
  shadow.position.z = C.near;
  shadow.scale.set(.45 * sh * (1 + C.sit * .35), .3 * sh * (1 + C.sit * .6), 1); shadow.material.opacity = .4 * sh;
}

/* ================= start ================= */
if (SHOT) {
  // portrait capture for the picker cards
  document.body.classList.add('shot');
  world.visible = false; scene.fog = null;
  todKey = 'morning'; applyTod();
  buildAvatar(byId(SHOT), () => {}).then(a => {
    av = window.__av = a; scene.add(av.holder); S.happy = 80; S.nextBlink = now() + 999; S.nextIdle = now() + 999;
    for (let i = 0; i < 40; i++) { last = now() - .03; frame(); }
    window.__shot = canvas.toDataURL('image/webp', .9);
  });
} else {
  function start(data) {
    if (data && data.tod && TOD[data.tod]) { todKey = data.tod; applyTod(); }
    showPick();
    if (data && data.char && byId(data.char)) { picked = data.char; callFriend(data.char); }
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ tod: todKey, char: av ? av.def.id : null }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
